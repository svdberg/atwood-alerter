<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <title>Atwood Blog Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8ff">
  <link rel="icon" type="image/jpeg" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="tailwind.css">
  <style>body { padding: 0; margin: 0; }</style>
</head>

<body>

<pre id="elm"></pre>

<script src="elm.js"></script>
<script>
	try {
'use strict';

  // Per-environment VAPID public key, filled in by build.sh. It must match the
  // key the environment's push Lambda signs with.
  const applicationServerKey = 'VAPID_PUBLIC_KEY_PLACEHOLDER';
  const pushConfigured = /^[A-Za-z0-9_-]{80,}$/.test(applicationServerKey);

  const urlBase64ToUint8Array = (base64String) => {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
  };

  const registerServiceWorker = async () => {
    return await navigator.serviceWorker.register('/sw.js');
  };

  const askPermission = async () => {
    const permission = await Notification.requestPermission();
    console.log('Notification permission:', permission);
	app.ports.pushRegistrationResponse.send(permission);
  };

  // True if the subscription was created with a different VAPID key, e.g.
  // before staging and production got separate keys. Push services reject
  // messages signed with any other key, so such a subscription is useless.
  const createdWithOtherKey = (sub) => {
    const key = sub.options && sub.options.applicationServerKey;
    if (!key) return false; // browser doesn't expose it; assume fine
    const current = urlBase64ToUint8Array(applicationServerKey);
    const existing = new Uint8Array(key);
    return existing.length !== current.length || existing.some((b, i) => b !== current[i]);
  };

  const subscribeToPush = async () => {
    if (!pushConfigured) {
      console.warn('Push notifications are not configured for this build.');
      return;
    }
    const reg = await registerServiceWorker();
    let sub = await reg.pushManager.getSubscription();
    if (sub && createdWithOtherKey(sub)) {
      console.log('Push subscription uses an outdated key; re-subscribing.');
      await sub.unsubscribe();
      sub = null;
    }
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(applicationServerKey)
      });
    }
    console.log('Push subscription:', JSON.stringify(sub));

    await fetch('API_BASE_URL_PLACEHOLDER' + '/register-subscription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub)
    });
  };

  const checkExistingSubscription = async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      app.ports.pushRegistrationResponse.send('granted');
    }
  };

  var app = Elm.Main.init({ node: document.getElementById("elm") });

  app.ports.requestPushRegistration.subscribe(() => {
    askPermission();
  });

  app.ports.subscribeToPush.subscribe(() => {
    subscribeToPush();
  });

  checkExistingSubscription();

	} catch (e)
{
  // display initialization errors (e.g. bad flags, infinite recursion)
  var header = document.createElement("h1");
  header.style.fontFamily = "monospace";
  header.innerText = "Initialization Error";
  var pre = document.getElementById("elm");
  document.body.insertBefore(header, pre);
  pre.innerText = e;
  throw e;
}
</script>

</body>
</html>
