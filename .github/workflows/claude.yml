name: Claude

# Issue → PR pipeline.
#  - Label an issue `claude`  → Claude implements it on a claude/ branch and opens a PR.
#  - Comment `@claude …`      → Claude answers / makes follow-up changes on that issue or PR.
# Only users with write access can trigger either path (enforced by the action).
# Claude never merges; a human reviews and merges every PR.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  implement-issue:
    name: Implement issue
    if: github.event_name == 'issues' && github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install toolchain
        run: |
          pip install -r requirements.txt -r tests/requirements.txt black isort flake8 mypy
          (cd elm-frontend && npm ci)

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Implement GitHub issue #${{ github.event.issue.number }} in this repository.
            Read it with `gh issue view ${{ github.event.issue.number }} --comments`.
            Follow CLAUDE.md, including its guardrails.

            1. If the issue is ambiguous, too large for one PR, or would need AWS access
               to verify, comment on the issue explaining what you need and stop.
            2. Create a branch `claude/issue-${{ github.event.issue.number }}-<short-slug>` from main.
            3. Make the change. Add or update tests in tests/ for any behaviour change.
            4. Run every check listed under "Commands" in CLAUDE.md and fix failures
               until they pass.
            5. Commit with a Conventional Commits message, push the branch, and open a PR with
               `gh pr create --base main`. Title: Conventional Commits format.
               Body: summary, how you verified it, risks, and `Closes #${{ github.event.issue.number }}`.
            6. Comment on the issue with a link to the PR.

            Never push to main and never merge.
          claude_args: |
            --max-turns 80

  respond-to-mention:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install toolchain
        run: pip install -r requirements.txt -r tests/requirements.txt black isort flake8 mypy

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
